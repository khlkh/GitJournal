name: Android

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Give more Disk Space
        run: sudo rm -rf /usr/share/dotnet
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Get Flutter version from pubspec
        run: |
          set -e
          FLUTTER_VERSION=$(cat pubspec.yaml | grep 'flutter:' | head -n 1 | awk '{ print $2 }' | tr -d '"' | cut -d "=" -f 2)
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/secrets/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=gitjournal\nstoreFile=../secrets/keystore.jks\n' \
            "${{ secrets.SIGNING_PASSWORD }}" "${{ secrets.SIGNING_PASSWORD }}" > android/secrets/key.properties
      - name: Setup env.json
        run: |
          mkdir -p secrets
          printf '{"sentry":"%s"}' "${{ secrets.SENTRY_DSN }}" > secrets/env.json
      - name: Setup Env
        run: dart ./scripts/setup_env.dart
      - name: Get Flutter Deps
        run: flutter pub get --suppress-analytics
      - name: Build
        run: ./scripts/build_android.sh
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
          generate_release_notes: true
